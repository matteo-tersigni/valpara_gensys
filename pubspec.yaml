name: valpara_gensys
description: "Valpara GenSys"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  shared_preferences: ^2.5.5
  file_picker: ^11.0.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  image_picker: ^1.2.1
  flutter_launcher_icons: ^0.14.3
  url_launcher: ^6.3.0
  webview_flutter: ^4.13.0
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_valpara.jpeg
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_valpara.jpeg"
  min_sdk_android: 21
